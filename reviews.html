<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reviews | SmartStock AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container py-4">
    <nav class="page-nav">
        <a href="/">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/purchase">Purchases</a>
        <a href="/sales">Sales</a>
        <a href="/reports">Reports</a>
        <a class="active" href="/reviews">Reviews</a>
        <button data-logout class="btn btn-sm btn-outline-secondary">Log out</button>
    </nav>
    <section class="content-card">
        <div class="card-heading">
            <div>
                <h1 class="section-title">Product Reviews</h1>
                <p class="section-caption mb-0">Select a product to read or publish reviews.</p>
            </div>
            <input id="reviewProductSearch" class="form-control search-box" placeholder="Search products">
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Rating</th>
                        <th>Reviews</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reviewProductsTable">
                    <tr><td colspan="5" class="table-message">Loading products...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="/static/reviews.js"></script>
</body>
</html>
