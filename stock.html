<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stock Transactions | SmartStock AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="container py-4"><nav class="page-nav"><a href="/">Dashboard</a><a href="/products">Products</a><a href="/categories">Categories</a><a href="/suppliers">Suppliers</a><a href="/customers">Customers</a><a href="/history">History</a><button data-logout class="btn btn-sm btn-outline-secondary">Log out</button></nav><section class="content-card p-4"><h1 class="page-title">Stock In / Stock Out</h1><p id="pageMessage" class="text-muted">Record inventory movements.</p><form id="stockForm" class="row g-3"><div class="col-md-4"><label class="form-label">Product</label><select id="stockProduct" class="form-select" required></select></div><div class="col-md-3"><label class="form-label">Transaction</label><select id="transactionType" class="form-select"><option value="in">Stock In</option><option value="out">Stock Out</option></select></div><div class="col-md-3"><label class="form-label">Quantity</label><input id="transactionQuantity" class="form-control" type="number" min="0.01" step="0.01" required></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Save</button></div><div class="col-12"><input id="transactionNotes" class="form-control" placeholder="Notes (optional)"></div></form></section></main><script src="/static/pages.js"></script></body></html>
