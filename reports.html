<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reports | SmartStock AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="container py-4"><nav class="page-nav"><a href="/">Dashboard</a><a href="/products">Products</a><a href="/purchase">Purchases</a><a href="/sales">Sales</a><a href="/audit">Audit</a><button data-logout class="btn btn-sm btn-outline-secondary">Log out</button></nav><h1 class="page-title">Reports and Analytics</h1><p id="pageMessage" class="text-muted">Generated: <span id="reportGenerated">Loading...</span></p><section id="reportCards" class="row g-3"><div class="col-md-4"><article class="summary-card"><div><p class="summary-label">Total products</p><p id="reportProducts" class="summary-value">--</p></div></article></div><div class="col-md-4"><article class="summary-card"><div><p class="summary-label">Stock value</p><p id="reportValue" class="summary-value">--</p></div></article></div><div class="col-md-4"><article class="summary-card"><div><p class="summary-label">Low-stock items</p><p id="reportLowStock" class="summary-value">--</p></div></article></div></section><section class="content-card p-4 mt-4"><h2 class="section-title">Inventory status chart</h2><div class="report-bars"><div class="report-bar"><span>Healthy stock</span><div class="bar-track"><i id="healthyBar"></i></div></div><div class="report-bar"><span>Low stock</span><div class="bar-track"><i id="lowBar"></i></div></div></div></section></main><script src="/static/pages.js"></script></body></html>
