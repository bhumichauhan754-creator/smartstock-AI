<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Management | SmartStock AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container py-4">
    <nav class="page-nav"><a href="/">Dashboard</a><a href="/categories">Categories</a><a href="/suppliers">Suppliers</a><a href="/customers">Customers</a><a href="/stock">Stock</a><a href="/reports">Reports</a><button data-logout class="btn btn-sm btn-outline-secondary">Log out</button></nav>
    <section class="content-card p-4 mb-4">
        <h1 class="page-title">Product Management</h1>
        <p id="pageMessage" class="text-muted">Create and manage inventory products.</p>
        <form id="productManagementForm" class="row g-3">
            <input type="hidden" id="productId">
            <div class="col-md-4"><label class="form-label">Product name</label><input id="productName" class="form-control" required maxlength="120"></div>
            <div class="col-md-3"><label class="form-label">Quantity</label><input id="productQuantity" class="form-control" type="number" min="0" step="0.01" value="0" required></div>
            <div class="col-md-3"><label class="form-label">Unit price</label><input id="productPrice" class="form-control" type="number" min="0" step="0.01" value="0" required></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Save product</button></div>
        </form>
    </section>
    <section class="content-card">
        <div class="card-heading"><h2 class="section-title">Products</h2><input id="productSearch" class="form-control search-box" placeholder="Search products"></div>
        <div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Quantity</th><th>Unit price</th><th>Actions</th></tr></thead><tbody id="managementTable"><tr><td colspan="4" class="table-message">Loading...</td></tr></tbody></table></div>
        <div class="p-3 d-flex justify-content-between align-items-center"><button id="previousPage" class="btn btn-sm btn-outline-secondary">Previous</button><span id="pageNumber">Page 1</span><button id="nextPage" class="btn btn-sm btn-outline-secondary">Next</button></div>
    </section>
</main>
<script src="/static/pages.js"></script>
</body>
</html>
