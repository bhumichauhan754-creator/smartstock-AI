<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales | SmartStock AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body><main class="container py-4"><nav class="page-nav"><a href="/">Dashboard</a><a href="/products">Products</a><a href="/purchase">Purchases</a><a href="/reports">Reports</a><button data-logout class="btn btn-sm btn-outline-secondary">Log out</button></nav><section class="content-card p-4"><h1 class="page-title">Sales Orders</h1><p id="pageMessage" class="text-muted">Sell available stock to customers.</p><form id="salesForm" class="row g-3"><div class="col-md-4"><select id="salesProduct" class="form-select" required></select></div><div class="col-md-3"><input id="salesQuantity" class="form-control" type="number" min=".01" step=".01" placeholder="Quantity" required></div><div class="col-md-3"><input id="salesPrice" class="form-control" type="number" min="0" step=".01" placeholder="Unit price" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Confirm sale</button></div></form><hr><table class="table"><thead><tr><th>ID</th><th>Product ID</th><th>Quantity</th><th>Price</th><th>Date</th></tr></thead><tbody id="salesTable"></tbody></table></section></main><script src="/static/advanced.js"></script></body></html>
