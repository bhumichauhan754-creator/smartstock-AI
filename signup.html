<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartStock AI | Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1 class="page-title">Create account</h1>
        <p class="text-muted">Start managing your inventory.</p>
        <div id="authMessage" class="alert alert-danger d-none"></div>
        <form id="authForm">
            <label class="form-label" for="name">Name</label>
            <input class="form-control mb-3" id="name" required maxlength="120">
            <label class="form-label" for="email">Email</label>
            <input class="form-control mb-3" id="email" type="email" required>
            <label class="form-label" for="password">Password</label>
            <input class="form-control mb-3" id="password" type="password" minlength="8" required>
            <button class="btn btn-primary w-100" type="submit">Sign up</button>
        </form>
        <p class="mt-3 mb-0 text-muted small">Already registered? <a href="/login">Log in</a></p>
    </main>
    <script src="/static/auth.js"></script>
</body>
</html>
